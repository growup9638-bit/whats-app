<style>

    justify-content:center;

  #sparkleCanvas{

  }
  .container{
    width:100%;

  /* aspect-ratio ab JS se dynamically set hogi, jaisi hi image load hogi */

    margin-bottom:22px;

  .icon{ width:22px; height:22px; }

  /* ============================================================================
     AD SLOTS — यहाँ अपने Ad Network (AdSense/Adsterra/Monetag) का <script> या
     <ins>/<iframe> कोड पेस्ट करना है। जब तक कुछ पेस्ट नहीं करोगे, ये जगह
     अपने आप छुप जाएगी (नीचे JS में) — कोई खाली बॉक्स नहीं दिखेगा।

     कुल 6 AD SLOTS हैं:
       - 1 ऊपर (top)          -> 300x250
       - 1 नीचे (bottom)      -> 728x90 (banner, mobile par auto-scale ho jayega)
       - 4 साइड (side)        -> 300x250 (हर तरफ 2-2, सिर्फ बड़ी स्क्रीन/लैपटॉप पर दिखेंगे,
                                  मोबाइल पर हाइड रहेंगे ताकि मोबाइल तेज़ खुले)
     ============================================================================ */
  .ad-slot{
    max-width:100%;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    z-index:1;
  }
  /* ऊपर/नीचे वाले banner (728x90) ka outer wrapper — chhoti screen par JS ise
     automatically scale kar dega taaki overflow na ho aur mobile fast rahe */
  .ad-slot-banner-outer{
    width:100%;
    max-width:728px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  /* ऊपर वाला स्लॉट — यहाँ लगाओ: 728x90 */
  .ad-slot-top{
    width:728px;
    height:90px;
    margin:0;
    transform-origin: center top;
  }
  /* नीचे वाला स्लॉट — यहाँ लगाओ: 728x90 */
  .ad-slot-bottom{
    width:728px;
    height:90px;
    margin:0;
    transform-origin: center top;
  }
  /* साइड वाले 4 स्लॉट (हर तरफ 2-2) — सिर्फ बड़ी स्क्रीन (लैपटॉप/डेस्कटॉप) पर दिखेंगे
     यहाँ लगाओ: हर एक में 300x250 */
  .ad-slot-side{
    width:300px;
    height:250px;
    position:fixed;
    display:none; /* mobile par hidden — neeche media query mein show hoga, mobile fast rahega */
    margin:0;
  }
  .ad-slot-side-left{ left:12px; }
  .ad-slot-side-right{ right:12px; }
  .ad-slot-side-top{ top:calc(50% - 270px); }
  .ad-slot-side-bottom{ top:calc(50% + 20px); }
  @media (min-width: 1100px){
    .ad-slot-side{ display:flex; }
  }
  /* JS isme ad code detect na hone par 'ad-slot-empty' class laga dega — tab poori jagah gayab ho jayegi */
  .ad-slot-empty{
    display:none !important;
  }
  /* ============================================================================ */

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#222; color:#fff;
    padding:12px 20px; border-radius:10px;
    font-size:14px; opacity:0; transition:all 0.3s; z-index:10;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
  .hidden{ display:none !important; }
</style>

  <div class="ad-slot-banner-outer" id="adSlotTopOuter">
    <div class="ad-slot ad-slot-top" id="adSlotTop">

        atOptions = {

<script>
/* ================================================================
   SETTINGS — बस यहीं बदलो, बाकी पूरी साइट अपने आप अपडेट हो जाएगी
   ================================================================ */
const IMAGE_FILENAME = "background.jpg";   // अपनी फोटो का नाम
const OCCASION_NAME  = "Teachers Day";           // यहाँ बदलो: "जन्मदिन", "Teacher's Day", "दीपावली", "होली" — कुछ भी
const BRAND_TEXT     = "AiMaster";         // अपना ब्रांड/नाम (बिना "की ओर से" के)
/* ================================================================ */

// इन सबको ऊपर वाले 3 वेरिएबल से ऑटोमेटिक बना दिया जाता है — यहाँ कुछ बदलने की ज़रूरत नहीं
const HEADING_TEMPLATE = (name) => `<span class="sender-name">${name}</span> की ओर से<br>${OCCASION_NAME} की हार्दिक शुभकामनाएं!`;
const SHARE_MESSAGE_TEMPLATE = (name, link) =>
  `🎉 *${name}* की ओर से ${OCCASION_NAME} की हार्दिक शुभकामनाएं!\nउन्होंने आपके लिए कुछ खास भेजा है। नीचे दिए लिंक पर क्लिक करें 👇\n${link}`;
const TELEGRAM_TEXT_TEMPLATE = (name) =>
  `🎉 ${name} की ओर से ${OCCASION_NAME} की हार्दिक शुभकामनाएं! उन्होंने आपके लिए कुछ खास भेजा है।`;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const canvasWrap = document.getElementById('canvasWrap');
const loadingDiv = document.getElementById('loadingDiv');

let bgImage = null;

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(bgImage){
    // Image poori dikhegi, bina crop/zoom ke — jo bhi photo ka shape ho
    ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#111";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#ffd700";
    ctx.font = "24px Arial";
    ctx.textAlign = "center";
    ctx.fillText("background.jpg daalein", canvas.width/2, canvas.height/2);
  }
}

const img = new Image();
img.onload = function(){
  bgImage = img;
  // Bade/heavy photo ka size mobile ke liye kam karo (max 1000px width) —
  // isse loading aur rendering dono mobile par fast rahenge
  const MAX_DIMENSION = 1000;
  let w = img.naturalWidth;
  let h = img.naturalHeight;
  if(w > MAX_DIMENSION || h > MAX_DIMENSION){
    const scale = MAX_DIMENSION / Math.max(w, h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  canvas.width = w;
  canvas.height = h;
  canvasWrap.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
  loadingDiv.style.display = 'none';
  render();
};
img.onerror = function(){
  bgImage = null;
  loadingDiv.textContent = "background.jpg nahi mili";
  render();
};
img.src = IMAGE_FILENAME;

/* ============ URL check: kya koi naam bhej ke aaya hai? ============ */
const params = new URLSearchParams(window.location.search);
const senderName = params.get('naam') || params.get('name');

const titleEl = document.getElementById('titleText');
const brandEl = document.getElementById('brandText');
const senderView = document.getElementById('senderView');
const receiverView = document.getElementById('receiverView');

if(senderName){
  // RECEIVER VIEW — kisi ne link bheja hai
  titleEl.innerHTML = HEADING_TEMPLATE(escapeHtml(senderName));
  brandEl.textContent = BRAND_TEXT;
  senderView.classList.add('hidden');
  receiverView.classList.remove('hidden');
  document.getElementById('pageTitle').textContent = `${senderName} की ओर से शुभकामनाएं 🎁`;
  document.getElementById('ogTitle').setAttribute('content', `${senderName} की ओर से ${OCCASION_NAME} की हार्दिक शुभकामनाएं! 🎁`);
  document.getElementById('ogDesc').setAttribute('content', `${senderName} ने आपके लिए कुछ खास भेजा है। देखने के लिए क्लिक करें।`);
} else {
  // SENDER VIEW — naya link banayenge
  titleEl.textContent = OCCASION_NAME + " की शुभकामनाएं";
  brandEl.textContent = BRAND_TEXT + " की ओर से";
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('createOwnBtn').addEventListener('click', function(){
  window.location.href = window.location.pathname;
});

function buildShareLink(name){
  const base = window.location.origin + window.location.pathname;
  return `${base}?naam=${encodeURIComponent(name)}`;
}

document.getElementById('shareBtn').addEventListener('click', function(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name){
    document.getElementById('nameInput').focus();
    return;
  }
  const link = buildShareLink(name);
  const message = SHARE_MESSAGE_TEMPLATE(name, link);
  const waLink = `https://wa.me/?text=${encodeURIComponent(message)}`;
  window.open(waLink, '_blank');
});

document.getElementById('telegramBtn').addEventListener('click', function(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name){
    document.getElementById('nameInput').focus();
    return;
  }
  const link = buildShareLink(name);
  const text = TELEGRAM_TEXT_TEMPLATE(name);
  const tgLink = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`;
  window.open(tgLink, '_blank');
});

render();

/* ============================================================================
   AD SLOT AUTO-HIDE — अगर किसी slot में कोई ad code नहीं डाला गया है (यानी
   div खाली है), तो वो जगह अपने आप गायब हो जाएगी। कोई खाली/टूटा बॉक्स नहीं दिखेगा।
   ============================================================================ */
function hideEmptyAdSlots(){
  document.querySelectorAll('.ad-slot').forEach(function(slot){
    const hasContent = slot.innerHTML.trim().length > 0;
    if(!hasContent){
      slot.classList.add('ad-slot-empty');
    } else {
      slot.classList.remove('ad-slot-empty');
    }
  });
}
// Page load hote hi check karo
hideEmptyAdSlots();
// Kuch ad networks apna code thodi der baad (async) inject karte hain, isliye 2 second baad dobara check
setTimeout(hideEmptyAdSlots, 2000);

/* ============================================================================
   BANNER (728x90) AUTO-SCALE — chhoti screen (mobile) par 728px chaudi ad
   overflow na ho, isliye JS se poore banner ko container ki width ke hisaab
   se scale kar diya jaata hai. Isse ad load bhi normal size mein hoti hai,
   bas visually chhoti dikhti hai — mobile par bilkul fit ho jaati hai.
   ============================================================================ */
function scaleBannerAds(){
  document.querySelectorAll('.ad-slot-banner-outer').forEach(function(outer){
    const inner = outer.querySelector('.ad-slot');
    if(!inner) return;
    const scale = Math.min(1, outer.clientWidth / 728);
    inner.style.transform = `scale(${scale})`;
    outer.style.height = Math.round(90 * scale) + 'px';
  });
}
scaleBannerAds();
window.addEventListener('resize', scaleBannerAds);
// Ad inject hone ke baad bhi dobara scale set karo

/* ============================================================================ */

/* ============ SPARKLE BACKGROUND (mobile par halka rakha gaya hai) ============ */
const sparkleCanvas = document.getElementById('sparkleCanvas');
const sctx = sparkleCanvas.getContext('2d');
let particles = [];

// Chhoti screen (mobile) par kam particles aur halka glow — smooth performance ke liye
const isMobile = window.innerWidth < 700;
const PARTICLE_COUNT = isMobile ? 25 : 60;
const SHADOW_BLUR = isMobile ? 0 : 6;

function resizeSparkle(){
  sparkleCanvas.width = window.innerWidth;
  sparkleCanvas.height = window.innerHeight;
}
resizeSparkle();
window.addEventListener('resize', resizeSparkle);

function createParticle(){
  return {
    x: Math.random() * sparkleCanvas.width,
    y: sparkleCanvas.height + 10,
    r: Math.random() * 2 + 1,
    speed: Math.random() * 0.8 + 0.3,
    drift: (Math.random() - 0.5) * 0.5,
    opacity: Math.random() * 0.6 + 0.3,
    twinkleSpeed: Math.random() * 0.05 + 0.02
  };
}
for(let i=0; i<PARTICLE_COUNT; i++){
  const p = createParticle();
  p.y = Math.random() * sparkleCanvas.height;
  particles.push(p);
}

function animateSparkles(){
  sctx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);
  particles.forEach(p => {
    p.y -= p.speed;
    p.x += p.drift;
    p.opacity += (Math.random() - 0.5) * p.twinkleSpeed;
    p.opacity = Math.max(0.1, Math.min(0.9, p.opacity));
    if(p.y < -10){
      Object.assign(p, createParticle());
      p.y = sparkleCanvas.height + 10;
    }
    sctx.beginPath();
    sctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    sctx.fillStyle = `rgba(255, 215, 0, ${p.opacity})`;
    if(SHADOW_BLUR > 0){
      sctx.shadowBlur = SHADOW_BLUR;
      sctx.shadowColor = 'rgba(255,215,0,0.8)';
    }
    sctx.fill();
  });
  requestAnimationFrame(animateSparkles);
}
animateSparkles();
</script>
