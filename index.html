<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2b0a0a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preload" as="image" href="background.gif" />
<title id="pageTitle">Shubhkamnaye - अपना नाम लिखें</title>

<meta property="og:title" content="Shubhkamnaye 🪔" id="ogTitle" />
<meta property="og:description" content="Aapke liye kisi ne shubhkamnaye bheji hain!" id="ogDesc" />
<meta property="og:image" content="background.gif" />
<meta property="og:type" content="website" />

<style>
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{ touch-action:manipulation; }
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:linear-gradient(180deg, #2b0a0a 0%, #4a0e0e 50%, #2b0a0a 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:24px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  #sparkleCanvas{
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index:0;
  }
  .container{
    width:100%;
    max-width:420px;
    text-align:center;
    position:relative;
    z-index:1;
  }
  .canvas-wrap{
    width:100%;
    max-height:70vh;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:22px;
    box-shadow:0 0 0 3px #ffd700, 0 0 30px rgba(255,215,0,0.5);
    position:relative;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas.mainCanvas{ width:100%; height:100%; display:block; }
  .loading{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    background:#111; color:#ffd700; font-size:14px;
  }
  h1.title{
    color:#ffd700;
    font-size:28px;
    font-weight:800;
    margin-bottom:6px;
    line-height:1.3;
    text-shadow:0 0 15px rgba(255,215,0,0.7), 0 2px 10px rgba(0,0,0,0.5);
    animation: glow 2s ease-in-out infinite alternate;
  }
  h1.title .sender-name{
    color:#fff;
  }
  @keyframes glow{
    from{ text-shadow:0 0 10px rgba(255,215,0,0.5); }
    to{ text-shadow:0 0 25px rgba(255,215,0,0.9); }
  }
  p.brand{
    color:#f5f5f5;
    font-size:15px;
    font-weight:600;
    margin-bottom:20px;
    opacity:0.9;
  }
  p.subMsg{
    color:#f0e6d2;
    font-size:14px;
    margin-bottom:24px;
    opacity:0.85;
  }
  label.field-label{
    display:block;
    color:#f0f0f0;
    font-size:15px;
    margin-bottom:10px;
  }
  input[type="text"]{
    width:100%;
    padding:16px 18px;
    border-radius:12px;
    border:2px solid transparent;
    font-size:16px;
    background:#fdf6e3;
    color:#333;
    margin-bottom:20px;
    text-align:center;
    outline:none;
  }
  input[type="text"]:focus{ border-color:#ffd700; }

  button.share-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:14px;
    font-size:17px;
    font-weight:700;
    color:#fff;
    background:#25D366;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    box-shadow:0 6px 18px rgba(37,211,102,0.4);
    margin-bottom:12px;
  }
  button.share-btn:active{ transform:scale(0.98); }

  button.create-own-btn{
    width:100%;
    padding:16px;
    border-radius:14px;
    font-size:15px;
    font-weight:700;
    color:#2b0a0a;
    background:#ffd700;
    border:none;
    cursor:pointer;
    margin-top:8px;
  }

  .icon{ width:22px; height:22px; }

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#222; color:#fff;
    padding:12px 20px; border-radius:10px;
    font-size:14px; opacity:0; transition:all 0.3s; z-index:10;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<canvas id="sparkleCanvas"></canvas>

<div class="container">

  <div class="canvas-wrap" id="canvasWrap">
    <canvas class="mainCanvas" id="canvas" width="800" height="600"></canvas>
    <div class="loading" id="loadingDiv">Photo load ho rahi hai...</div>
  </div>

  <h1 class="title" id="titleText">Shubhkamnaye</h1>
  <p class="brand" id="brandText">की ओर से</p>

  <!-- ===== SENDER VIEW: naam likh kar share kare ===== -->
  <div id="senderView">
    <p class="subMsg">Apna naam likho aur share karo — jise bhi bhejoge, usme tumhara naam dikhega!</p>
    <label class="field-label">आपका नाम:</label>
    <input type="text" id="nameInput" placeholder="यहाँ अपना नाम लिखें" maxlength="30" />

    <button class="share-btn" id="shareBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="white"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L7.04 9.81C6.5 9.31 5.79 9 5 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
      Share करें
    </button>
  </div>

  <!-- ===== RECEIVER VIEW: jab kisi ne link bheja ===== -->
  <div id="receiverView" class="hidden">
    <p class="subMsg" id="receiverMsg">उन्होंने आपके लिए यह खास शुभकामना भेजी है 🎁</p>
  </div>

</div>

<div class="toast" id="toast">Link copy ho gaya!</div>

<script>
/* ================================================================
   SETTINGS — बस यहीं बदलो, बाकी पूरी साइट अपने आप अपडेट हो जाएगी
   ================================================================ */
const IMAGE_FILENAME = "background.gif";   // अपनी फोटो का नाम
const OCCASION_NAME  = "Teachers Day";     // यहाँ बदलो: "जन्मदिन", "Teacher's Day", "दीपावली", "होली" — कुछ भी
const BRAND_TEXT     = "AiMaster";         // अपना ब्रांड/नाम (बिना "की ओर से" के)
/* ================================================================ */

const HEADING_TEMPLATE = (name) => `<span class="sender-name">${name}</span> की ओर से<br>${OCCASION_NAME} की हार्दिक शुभकामनाएं!`;
const SHARE_MESSAGE_TEMPLATE = (name, link) =>
  `🎉 *${name}* की ओर से ${OCCASION_NAME} की हार्दिक शुभकामनाएं!\nउन्होंने आपके लिए कुछ खास भेजा है। नीचे दिए लिंक पर क्लिक करें 👇\n${link}`;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const canvasWrap = document.getElementById('canvasWrap');
const loadingDiv = document.getElementById('loadingDiv');
const toast = document.getElementById('toast');

let bgImage = null;

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(bgImage){
    ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#111";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#ffd700";
    ctx.font = "24px Arial";
    ctx.textAlign = "center";
    ctx.fillText("background.gif daalein", canvas.width/2, canvas.height/2);
  }
}

const img = new Image();
img.onload = function(){
  bgImage = img;
  const MAX_DIMENSION = 1000;
  let w = img.naturalWidth;
  let h = img.naturalHeight;
  if(w > MAX_DIMENSION || h > MAX_DIMENSION){
    const scale = MAX_DIMENSION / Math.max(w, h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  canvas.width = w;
  canvas.height = h;
  canvasWrap.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
  loadingDiv.style.display = 'none';
  render();
};
img.onerror = function(){
  bgImage = null;
  loadingDiv.textContent = "background.gif nahi mili";
  render();
};
img.src = IMAGE_FILENAME;

/* ============ URL check: kya koi naam bhej ke aaya hai? ============ */
const params = new URLSearchParams(window.location.search);
const senderName = params.get('naam') || params.get('name');

const titleEl = document.getElementById('titleText');
const brandEl = document.getElementById('brandText');
const senderView = document.getElementById('senderView');
const receiverView = document.getElementById('receiverView');

if(senderName){
  titleEl.innerHTML = HEADING_TEMPLATE(escapeHtml(senderName));
  brandEl.textContent = BRAND_TEXT;
  senderView.classList.add('hidden');
  receiverView.classList.remove('hidden');
  document.getElementById('pageTitle').textContent = `${senderName} की ओर से शुभकामनाएं 🎁`;
  document.getElementById('ogTitle').setAttribute('content', `${senderName} की ओर से ${OCCASION_NAME} की हार्दिक शुभकामनाएं! 🎁`);
  document.getElementById('ogDesc').setAttribute('content', `${senderName} ने आपके लिए कुछ खास भेजा है। देखने के लिए क्लिक करें।`);
} else {
  titleEl.textContent = OCCASION_NAME + " की शुभकामनाएं";
  brandEl.textContent = BRAND_TEXT + " की ओर से";
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function buildShareLink(name){
  const base = window.location.origin + window.location.pathname;
  return `${base}?naam=${encodeURIComponent(name)}`;
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ============ SHARE: mobile par native share sheet (sabhi installed apps),
   jahan native share nahi milta (jyadatar desktop), wahan WhatsApp/copy fallback ============ */
document.getElementById('shareBtn').addEventListener('click', async function(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name){
    document.getElementById('nameInput').focus();
    return;
  }
  const link = buildShareLink(name);
  const message = SHARE_MESSAGE_TEMPLATE(name, link);

  if(navigator.share){
    try{
      await navigator.share({ title: document.title, text: message, url: link });
      return;
    }catch(err){
      // user ne share cancel kiya ya error aaya — fallback niche chalega
      if(err && err.name === 'AbortError') return;
    }
  }

  // Fallback (desktop / jahan Web Share API support nahi hai, ya http/file par test ho raha hai):
  // WhatsApp turant kholo (isi click ke andar, bina kisi await ke) — warna mobile browser
  // ise popup samajh kar block kar deta hai.
  const waLink = `https://wa.me/?text=${encodeURIComponent(message)}`;
  window.open(waLink, '_blank');
  try{
    await navigator.clipboard.writeText(message);
    showToast('Link copy ho gaya!');
  }catch(e){ /* clipboard fail ho to bhi WhatsApp khulega */ }
});

render();

/* ============ SPARKLE BACKGROUND (mobile par halka rakha gaya hai) ============ */
const sparkleCanvas = document.getElementById('sparkleCanvas');
const sctx = sparkleCanvas.getContext('2d');
let particles = [];

const isMobile = window.innerWidth < 700;
const PARTICLE_COUNT = isMobile ? 25 : 60;
const SHADOW_BLUR = isMobile ? 0 : 6;

function resizeSparkle(){
  sparkleCanvas.width = window.innerWidth;
  sparkleCanvas.height = window.innerHeight;
}
resizeSparkle();
window.addEventListener('resize', resizeSparkle);

function createParticle(){
  return {
    x: Math.random() * sparkleCanvas.width,
    y: sparkleCanvas.height + 10,
    r: Math.random() * 2 + 1,
    speed: Math.random() * 0.8 + 0.3,
    drift: (Math.random() - 0.5) * 0.5,
    opacity: Math.random() * 0.6 + 0.3,
    twinkleSpeed: Math.random() * 0.05 + 0.02
  };
}
for(let i=0; i<PARTICLE_COUNT; i++){
  const p = createParticle();
  p.y = Math.random() * sparkleCanvas.height;
  particles.push(p);
}

function animateSparkles(){
  sctx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);
  particles.forEach(p => {
    p.y -= p.speed;
    p.x += p.drift;
    p.opacity += (Math.random() - 0.5) * p.twinkleSpeed;
    p.opacity = Math.max(0.1, Math.min(0.9, p.opacity));
    if(p.y < -10){
      Object.assign(p, createParticle());
      p.y = sparkleCanvas.height + 10;
    }
    sctx.beginPath();
    sctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    sctx.fillStyle = `rgba(255, 215, 0, ${p.opacity})`;
    if(SHADOW_BLUR > 0){
      sctx.shadowBlur = SHADOW_BLUR;
      sctx.shadowColor = 'rgba(255,215,0,0.8)';
    }
    sctx.fill();
  });
  requestAnimationFrame(animateSparkles);
}
animateSparkles();
</script>

</body>
</html>
